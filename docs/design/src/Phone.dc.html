<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマートフォン 会話</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="color-scheme: {{scheme}}; --color-background-body: light-dark(#f1f1f1, #1b1b1b); --color-text-primary: light-dark(#000000, #ffffff); --color-text-secondary: light-dark(#474747, #9e9e9e); --color-background-surface: light-dark(#ffffff, #262626); position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--color-background-body); color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.6">

<header style="position: absolute; z-index: 1; top: 0; left: 0; right: 0; box-sizing: border-box; padding: 8px 8px 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; justify-items: center; background: transparent">
<button type="button" aria-label="メニュー（会話・活動の記録・記憶・出来事・設定）" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 9999px; background: var(--color-background-surface); box-shadow: 0 2px 4px light-dark(oklch(0 0 0 / 5%), oklch(0 0 0 / 25%)), 0 4px 8px light-dark(oklch(0 0 0 / 10%), oklch(0 0 0 / 40%)); color: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{hasFails}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: -2px; right: -4px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9999px; background: light-dark(#c9303a, #ff705d); color: light-dark(#ffffff, #111111); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center">{{fails}}</span>
</sc-if>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<button type="button" aria-label="いまのエージェントを開く" style="position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 2px 16px; border: 0; border-radius: 0.75rem; background: transparent; color: inherit; font: inherit; cursor: pointer; filter: drop-shadow(0 4px 8px light-dark(oklch(0 0 0 / 15%), oklch(0 0 0 / 50%)))">
<dc-import name="Avatar" d="72px" label="{{ true }}" solid="{{ true }}" hint-size="72px,108px"></dc-import>
<span aria-hidden="true" style="position: absolute; top: 4px; left: calc(50% + 24px); width: 10px; height: 10px; border-radius: 9999px; border: 1.5px dashed var(--color-text-secondary); background: var(--color-background-body)"></span>
</button>
</header>

<sc-if value="{{isTalk}}" hint-placeholder-val="{{ true }}">
<dc-import name="Talk" subs="{{subs}}" mode="{{mode}}" attach="{{attach}}" strip="{{ true }}" h="{{talkH}}" size="16px" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{isSchedule}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; overflow: auto">
<dc-import name="Schedule" pad="140px" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
<sc-if value="{{isRecord}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; overflow: auto">
<dc-import name="Record" day="{{rday}}" pad="140px" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; overflow: auto">
<dc-import name="RecordDetail" kind="{{rkind}}" pad="132px" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isMemory}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; overflow: auto">
<dc-import name="Memory" view="{{mview}}" st="{{mst}}" file="{{mfile}}" commit="{{mcommit}}" from="{{mfrom}}" pad="140px" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

<sc-if value="{{kb}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; height: 336px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-top: 1px dashed var(--color-text-secondary); color: var(--color-text-secondary); font-size: 13px">[端末のキーボードが出る領域]</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["busy","empty","offline"],"default":"busy"},"kb":{"editor":"boolean","default":false},"page":{"editor":"enum","options":["talk","schedule","record","detail","memory"],"default":"talk"},"mview":{"editor":"text","default":"home"},"mst":{"editor":"text","default":"normal"},"mfile":{"editor":"text","default":"topic"},"mcommit":{"editor":"text","default":"day"},"mfrom":{"editor":"text","default":"memory"},"rday":{"editor":"text","default":"failures"},"rkind":{"editor":"text","default":"turn"},"fails":{"editor":"int","default":0,"min":0,"max":99},"subs":{"editor":"int","default":0,"min":0,"max":6},"attach":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const kb = !!this.props.kb;
return {
scheme: this.props.dark ? 'dark' : 'light',
mode: this.props.mode ?? 'busy',
kb: kb,
isTalk: (this.props.page ?? 'talk') === 'talk',
isSchedule: this.props.page === 'schedule',
isRecord: this.props.page === 'record',
isDetail: this.props.page === 'detail',
isMemory: this.props.page === 'memory',
mview: this.props.mview ?? 'home', mst: this.props.mst ?? 'normal', mfile: this.props.mfile ?? 'topic', mcommit: this.props.mcommit ?? 'day', mfrom: this.props.mfrom ?? 'memory',
rday: this.props.rday ?? 'failures',
rkind: this.props.rkind ?? 'turn',
fails: Number(this.props.fails ?? 0),
hasFails: Number(this.props.fails ?? 0) > 0,
subs: Number(this.props.subs ?? 0),
attach: !!this.props.attach,
talkH: kb ? '508px' : '844px'
};
}
}
</script>
</body>
</html>
