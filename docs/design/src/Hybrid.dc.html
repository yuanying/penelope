<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC 左は場所、右はいまのエージェント</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#474747}a:hover{color:#000000}
</style>
</helmet>
<div style="color-scheme: {{scheme}}; --color-background-body: light-dark(#f1f1f1, #1b1b1b); --color-background-surface: light-dark(#ffffff, #262626); --color-text-primary: light-dark(#000000, #ffffff); --color-text-secondary: light-dark(#474747, #9e9e9e); --color-border: light-dark(#00000014, #ffffff1A); --color-neutral: light-dark(#0000000F, #ffffff1A); --color-accent: light-dark(#1b1b1b, #f1f1f1); --color-on-accent: light-dark(#ffffff, #111111); --color-text-info: light-dark(#0067ce, #a1caff); min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; background: var(--color-background-body); color: var(--color-text-primary); font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.6">

<nav aria-label="場所" style="flex: 0 0 60px; box-sizing: border-box; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px">
<a href="#talk" aria-label="会話" style="width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 0.625rem; background: {{talkBg}}; color: {{talkFg}}; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></svg>
</a>
<a href="#log" aria-label="{{logLabel}}" style="width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; border-radius: 0.625rem; background: {{logBg}}; color: {{logFg}}; text-decoration: none">
<sc-if value="{{hasFails}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9999px; background: light-dark(#c9303a, #ff705d); color: light-dark(#ffffff, #111111); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center">{{fails}}</span>
</sc-if>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
</a>
<a href="#memory" aria-label="記憶" style="width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 0.625rem; background: {{memBg}}; color: {{memFg}}; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5V4z"/><path d="M9 10h6M9 14h6" stroke-linecap="round"/></svg>
</a>
<a href="#events" aria-label="出来事と予約" style="width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 0.625rem; background: {{evBg}}; color: {{evFg}}; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 13l3-8h10l3 8v6H4v-6z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>
</a>
<a href="#settings" aria-label="設定" style="width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 0.625rem; color: var(--color-text-secondary); text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</nav>

<main id="talk" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: flex-end">
<button type="button" onClick="{{toggle}}" aria-expanded="{{openStr}}" aria-label="いまのエージェントを開く・閉じる" style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px 4px 12px; border: 0; border-radius: 9999px; background: transparent; color: inherit; font: inherit; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; color: var(--color-text-secondary)">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 9999px; background: {{dotColor}}"></span>
<span>{{statusText}}</span>
</span>
<sc-if value="{{hasSubs}}" hint-placeholder-val="{{ false }}">
<span style="padding: 2px 10px; border-radius: 9999px; background: var(--color-neutral); color: var(--color-text-secondary); font-size: 12px">サブ {{subs}}</span>
</sc-if>
<span style="font-weight: 600; font-size: 16px">ペネロペ</span>
<dc-import name="Avatar" d="36px" label="{{ false }}" hint-size="36px,36px"></dc-import>
<span aria-hidden="true" style="position: absolute; top: 4px; right: 8px; width: 10px; height: 10px; border-radius: 9999px; border: 1.5px dashed var(--color-text-secondary); background: var(--color-background-body)"></span>
</button>
</header>
<sc-if value="{{isTalk}}" hint-placeholder-val="{{ true }}">
<dc-import name="Talk" mode="{{mode}}" attach="{{attach}}" h="calc(100vh - 56px)" size="14px" hint-size="100%,764px"></dc-import>
</sc-if>
<sc-if value="{{isSchedule}}" hint-placeholder-val="{{ false }}">
<div style="height: calc(100vh - 56px); overflow: auto">
<dc-import name="Schedule" pad="24px" hint-size="100%,900px"></dc-import>
</div>
</sc-if>
<sc-if value="{{isRecord}}" hint-placeholder-val="{{ false }}">
<div style="height: calc(100vh - 56px); overflow: auto">
<dc-import name="Record" day="{{rday}}" pad="24px" hint-size="100%,900px"></dc-import>
</div>
</sc-if>
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div style="height: calc(100vh - 56px); overflow: auto">
<dc-import name="RecordDetail" kind="{{rkind}}" pad="12px" hint-size="100%,900px"></dc-import>
</div>
</sc-if>
<sc-if value="{{isMemory}}" hint-placeholder-val="{{ false }}">
<div style="height: calc(100vh - 56px); overflow: auto">
<dc-import name="Memory" view="{{mview}}" st="{{mst}}" file="{{mfile}}" commit="{{mcommit}}" from="{{mfrom}}" pad="24px" hint-size="100%,900px"></dc-import>
</div>
</sc-if>
</main>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<aside aria-label="いまのエージェント" style="flex: 1 1 380px; max-width: 440px; min-width: 0; box-sizing: border-box; height: calc(100vh - 32px); margin: 16px 16px 16px 0; padding: 20px; overflow: auto; background: var(--color-background-surface); border: 1px solid var(--color-border); border-radius: 0.75rem; display: flex; flex-direction: column; gap: 24px">
<div style="flex: none; padding: 24px 0 16px; display: flex; justify-content: center; border-radius: 0.75rem; background: var(--color-background-body)">
<dc-import name="Avatar" d="120px" label="{{ true }}" hint-size="120px,160px"></dc-import>
</div>
<section aria-labelledby="hy-approvals" style="flex: none; display: flex; flex-direction: column; gap: 4px">
<h2 id="hy-approvals" style="margin: 0; font-size: 12px; font-weight: 600; color: var(--color-text-secondary)">承認待ち</h2>
<p style="margin: 0; color: var(--color-text-secondary)">いまはありません</p>
</section>
<sc-if value="{{hasSubs}}" hint-placeholder-val="{{ false }}">
<dc-import name="Agents" n="{{subs}}" hint-size="100%,240px"></dc-import>
</sc-if>
<dc-import name="Activity" idle="{{idle}}" hint-size="100%,560px"></dc-import>
</aside>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["busy","empty","offline"],"default":"busy"},"attach":{"editor":"boolean","default":false},"subs":{"editor":"int","default":0,"min":0,"max":6},"closed":{"editor":"boolean","default":false},"page":{"editor":"enum","options":["talk","schedule","record","detail","memory"],"default":"talk"},"mview":{"editor":"text","default":"home"},"mst":{"editor":"text","default":"normal"},"mfile":{"editor":"text","default":"topic"},"mcommit":{"editor":"text","default":"day"},"mfrom":{"editor":"text","default":"memory"},"rday":{"editor":"text","default":"failures"},"rkind":{"editor":"text","default":"turn"},"fails":{"editor":"int","default":0,"min":0,"max":99},"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open === undefined ? !this.props.closed : st.open;
const subs = Number(this.props.subs ?? 0);
const mode = this.props.mode ?? 'busy';
const pg = this.props.page ?? 'talk';
const on = 'var(--color-neutral)', fg = 'var(--color-text-primary)', mu = 'var(--color-text-secondary)';
return {
mode: mode,
isTalk: pg === 'talk',
isSchedule: pg === 'schedule',
isRecord: pg === 'record',
isDetail: pg === 'detail',
isMemory: pg === 'memory',
mview: this.props.mview ?? 'home', mst: this.props.mst ?? 'normal', mfile: this.props.mfile ?? 'topic', mcommit: this.props.mcommit ?? 'day', mfrom: this.props.mfrom ?? 'memory',
memBg: pg === 'memory' ? on : 'transparent',
memFg: pg === 'memory' ? fg : mu,
rday: this.props.rday ?? 'failures',
rkind: this.props.rkind ?? 'turn',
fails: Number(this.props.fails ?? 0),
hasFails: Number(this.props.fails ?? 0) > 0,
logLabel: Number(this.props.fails ?? 0) > 0 ? ('活動の記録（まだ見ていない失敗 ' + Number(this.props.fails) + ' 件）') : '活動の記録',
talkBg: pg === 'talk' ? on : 'transparent',
talkFg: pg === 'talk' ? fg : mu,
logBg: (pg === 'record' || pg === 'detail') ? on : 'transparent',
logFg: (pg === 'record' || pg === 'detail') ? fg : mu,
evBg: pg === 'schedule' ? on : 'transparent',
evFg: pg === 'schedule' ? fg : mu,
subs: subs,
hasSubs: subs > 0,
attach: !!this.props.attach,
idle: mode === 'empty',
statusText: mode === 'busy' ? '考えている' : (mode === 'offline' ? '接続なし' : '待っている'),
dotColor: mode === 'busy' ? 'var(--color-text-info)' : (mode === 'offline' ? 'light-dark(#836700, #eec448)' : 'var(--color-text-secondary)'),
scheme: this.props.dark ? 'dark' : 'light',
open: open,
openStr: open ? 'true' : 'false',
toggle: () => this.setState({ open: !open })
};
}
}
</script>
</body>
</html>
