# The Sentinel's configuration for the end-to-end test (docs/sentinel-config.md).
# Every name is made up; the surrogates are the sandbox's, and the real keys
# are made afresh for every run under e2e/.run/.
listen:
  proxy: ["0.0.0.0:15001", "[::]:15001"]
  dns: ["0.0.0.0:15053", "[::]:15053"]
ca:
  cert: /run/secrets/e2e/sentinel-ca.crt
  key: /run/secrets/e2e/sentinel-ca.key
default: passthrough
hosts:
  - name: model.example.com
    upstream_ca: /run/secrets/e2e/outside-ca.crt
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-model-0001
        source: { file: /run/secrets/e2e/model-key }
  - name: helper.example.com
    upstream_ca: /run/secrets/e2e/outside-ca.crt
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-helper-0001
        source: { file: /run/secrets/e2e/model-key }
  - name: backend.example.com
    upstream: unix:///run/penelope/sandbox/backend.sock
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-backend-0001
        source: { file: /run/secrets/e2e/backend-token }
  - name: house.example.com
    upstream_ca: /run/secrets/e2e/outside-ca.crt
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-house-0001
        source: { file: /run/secrets/e2e/sender-token }
  # Slack's Web API, for slackctl post (ADR-0033). Its upload URL is
  # opened only to be sent to the fake, and has no credential: slackctl
  # sends it no token, and a surrogate there is refused.
  - name: slack.com
    upstream_ca: /run/secrets/e2e/outside-ca.crt
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-slack-0001
        source: { file: /run/secrets/e2e/slack-bot-token }
  - name: files.slack.com
    upstream_ca: /run/secrets/e2e/outside-ca.crt
  # One registration for every app's name (ADR-0025).
  - name: "*.apps.example.com"
    upstream_ca: /run/secrets/e2e/outside-ca.crt
    credentials:
      - place: bearer
        surrogate: e2e-surrogate-apps-0001
        source: { file: /run/secrets/e2e/model-key }
allow: []
