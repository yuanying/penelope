# What this deployment adds to the base's Pod.
#
# - An avatar of its own (README.md, "Avatar"): the init container avatar
#   fetches one avatar directory into the emptyDir avatars, which the
#   backend alone mounts as PENELOPE_AVATARS_DIR. The backend copies the
#   avatar named PENELOPE_AVATAR from there into /memory/avatar/ once, when
#   /memory has none; after that she grows it there (ADR-0036), and this can
#   be dropped. A deployment that uses an avatar in the images drops all of
#   this and sets only PENELOPE_AVATAR.
# - A ServiceAccount token with the audience a2a for the Sentinel, put in
#   place of HELPER_AGENT_TOKEN (sentinel/sentinel.yaml).
# - A ServiceAccount token with gated's audience for the Sentinel, put in
#   place of X_SEARCH_TOKEN when calling llm-proxy in xAI mode.
#
# The containers are matched by name, so their order stays the base's. The
# init container avatar comes first; it has to run before the redirect.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penelope
spec:
  template:
    spec:
      initContainers:
      - name: avatar
        image: ghcr.io/yuanying/penelope-sandbox
        command:
        - sh
        - /etc/penelope/init/avatar.sh
        env:
        - name: HOME
          value: /tmp
        - name: AVATAR_REPO
          value: https://github.com/example/avatars.git
        - name: AVATAR_BRANCH
          value: main
        - name: AVATAR_PATH
          value: example
        - name: AVATAR_NAME
          value: example
        - name: AVATARS_DIR
          value: /avatars
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: init
          mountPath: /etc/penelope/init
          readOnly: true
        - name: avatars
          mountPath: /avatars
        - name: skills-tmp
          mountPath: /tmp
      containers:
      - name: backend
        env:
        - name: PENELOPE_AVATARS_DIR
          value: /etc/penelope/avatars
        volumeMounts:
        - name: avatars
          mountPath: /etc/penelope/avatars
          readOnly: true
      - name: sentinel
        volumeMounts:
        - name: a2a-token
          mountPath: /run/secrets/penelope-sentinel/a2a
          readOnly: true
        - name: x-search-token
          mountPath: /run/secrets/penelope-sentinel/x-search
          readOnly: true
      volumes:
      - name: avatars
        emptyDir:
          sizeLimit: 64Mi
      - name: a2a-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              audience: a2a
              expirationSeconds: 3600
              path: token
      - name: x-search-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              audience: https://auth.example.com
              expirationSeconds: 3600
              path: token
