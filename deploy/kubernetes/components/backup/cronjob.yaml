apiVersion: batch/v1
kind: CronJob
metadata:
  name: penelope-backup
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: penelope
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: penelope
                    app.kubernetes.io/component: agent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          - name: select-backup
            image: ghcr.io/yuanying/penelope-backend
            command:
            - node
            - /etc/penelope-backup/select-backup.mjs
            env:
            - name: BACKUP_METRICS_URL
              value: http://penelope-metrics:9100/metrics
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
                add:
                - DAC_READ_SEARCH
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: staging
              mountPath: /staging
            - name: scripts
              mountPath: /etc/penelope-backup
              readOnly: true
          - name: sqlite
            image: ghcr.io/yuanying/penelope-backend
            command:
            - sh
            - -ec
            - |
              if [ -f /staging/backup-stamp ]; then
                exec node --no-warnings /etc/penelope-backup/sqlite-backup.mjs /var/lib/penelope/backend.sqlite /staging/backend.sqlite
              fi
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            volumeMounts:
            # Writable: SQLite in WAL mode writes its shared-memory file even to read.
            - name: state
              mountPath: /var/lib/penelope
              subPath: backend
            - name: staging
              mountPath: /staging
            - name: scripts
              mountPath: /etc/penelope-backup
              readOnly: true
          containers:
          - name: archive
            image: ghcr.io/yuanying/penelope-sandbox
            command:
            - sh
            - /etc/penelope-backup/archive.sh
            env:
            - name: KEEP_DAYS
              value: "14"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
                add:
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - FOWNER
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: state
              mountPath: /volume/state
              readOnly: true
            - name: memory
              mountPath: /volume/memory
              readOnly: true
            - name: staging
              mountPath: /staging
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: scripts
              mountPath: /etc/penelope-backup
              readOnly: true
          volumes:
          - name: state
            persistentVolumeClaim:
              claimName: penelope
          - name: memory
            persistentVolumeClaim:
              claimName: penelope-memory
          - name: staging
            emptyDir:
              sizeLimit: 512Mi
          - name: scripts
            configMap:
              name: penelope-backup
          - name: backup
            persistentVolumeClaim:
              claimName: penelope-backup
